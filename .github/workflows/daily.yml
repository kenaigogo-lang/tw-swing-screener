name: 每日選股

on:
  schedule:
    # 週一到週五（法人資料收盤後才公布）；避開整點以減少 GitHub 排程延遲，20:17 為備援
    - cron: "17 10 * * 1-5"  # 台灣時間 18:17
    - cron: "17 12 * * 1-5"  # 台灣時間 20:17
  workflow_dispatch:          # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python screener.py
      - name: 存回資料與報表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "每日選股 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
